services:
  kong:
    image: kong/kong-gateway:3.14
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_REQUIRE_HTTPS_OFF_TERMINATION: "yes"
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: info
      KONG_PLUGINS: "bundled,account-uuid-header"
      KONG_MEM_CACHE_SIZE: "128m"
      KONG_NGINX_WORKER_PROCESSES: "2"
      KONG_LUA_SHARED_DICT: "kong_db_cache 128m, kong 128m, kong_locks 16m"
      KONG_DNS_RES_TTL: "30"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./kong.yml:/etc/kong/kong.yml:ro
      - ./plugins/account-uuid-header:/usr/local/share/lua/5.1/kong/plugins/account-uuid-header:ro
    restart: unless-stopped
    networks:
      - galaxy-net
