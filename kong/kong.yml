_format_version: "3.0"
_transform: true

services:
  - name: auth-service
    url: http://auth-service:8080
    routes:
      - name: auth-public-route
        paths:
          - /scalar
          - /openapi
          - ~/api/auth/(login|register|otp-confirm|reset-otp-confirm|forgot-password|reset-password|refresh-token)$
        strip_path: false

      - name: auth-protected-route
        paths:
          - /api/profile
          - ~/api/auth/(logout|full-logout)$
        strip_path: false
        plugins:
          - name: jwt
            config:
              cookie_names:
                - access_token

          - name: account-uuid-header

consumers:
  - username: internal-consumer
    jwt_secrets:
      - key: "galaxy-auth"
        secret: "YourSuperSecretLongAndComplexKeyAtLeast32Chars123!"
        algorithm: HS256
