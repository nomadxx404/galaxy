_format_version: "3.0"
_transform: true

services:
  - name: auth-service
    url: http://auth-service:8080
    routes:
      - name: auth-docs-route
        paths:
          - /auth
        strip_path: true

      - name: auth-public-api-route
        paths:
          - /api/auth/login
          - /api/auth/register
          - /api/auth/otp-confirm
          - /api/auth/reset-otp-confirm
          - /api/auth/forgot-password
          - /api/auth/reset-password
          - /api/auth/refresh-token
        strip_path: false

      - name: auth-protected-route
        paths:
          - /api/profile
          - /api/auth/logout
          - /api/auth/full-logout
        strip_path: false
        plugins:
          - name: jwt
            config:
              cookie_names:
                - access_token
          - name: account-uuid-header
    plugins:
      - name: cors
        config:
          origins:
            # - http://localhost:8080 front
            - http://localhost:8000
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - Origin
          exposed_headers:
            - Set-Cookie
          credentials: true
          max_age: 3600

  - name: companies-service
    url: http://companies-service:8080
    routes:
      - name: companies-public-route
        paths:
          - /companies
        strip_path: false

      - name: companies-protected-route
        paths:
          - /api/companies
        strip_path: false
        plugins:
          - name: jwt
            config:
              cookie_names:
                - access_token
          - name: account-uuid-header
    plugins:
      - name: cors
        config:
          origins:
            # - http://localhost:8080 front
            - http://localhost:8000
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - Origin
          exposed_headers:
            - Set-Cookie
          credentials: true
          max_age: 3600

consumers:
  - username: internal-consumer
    jwt_secrets:
      - key: "galaxy-auth"
        secret: "YourSuperSecretLongAndComplexKeyAtLeast32Chars123!"
        algorithm: HS256
