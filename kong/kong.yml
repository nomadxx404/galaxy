_format_version: "3.0"
_transform: true

plugins:
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

services:
  - name: bff-service
    url: http://bff-service:8080
    routes:
      - name: bff-ui-route
        paths:
          - /ui
          - /api/ui
        strip_path: false
        protocols:
          - http
          - https
    plugins:
      - name: jwt
        config:
          cookie_names:
            - access_token
      - name: account-uuid-header
      - name: cors
        config:
          origins:
            - http://localhost:8000
            # - http://localhost:8080 front
          methods: [GET, OPTIONS]
          headers:
            - Accept
            - Authorization
            - Content-Type
            - Origin
            - X-Request-ID
          exposed_headers:
            - Set-Cookie
          credentials: true
          max_age: 3600


  - name: auth-service
    url: http://auth-service:8080
    routes:
      - name: auth-docs-route
        paths:
          - /auth
          - /scalar
        strip_path: true
        protocols: [http, https]

      - name: auth-public-api-route
        paths:
          - /api/auth/login
          - /api/auth/register
          - /api/auth/otp-confirm
          - /api/auth/reset-otp-confirm
          - /api/auth/forgot-password
          - /api/auth/reset-password
          - /api/auth/refresh-token
        strip_path: false
        protocols: [http, https]

      - name: auth-protected-route
        paths:
          - /api/profile
          - /api/auth/logout
          - /api/auth/full-logout
        strip_path: false
        protocols: [http, https]
        plugins:
          - name: jwt
            config:
              cookie_names:
                - access_token
          - name: account-uuid-header
    plugins:
      - name: cors
        config:
          origins:
            - http://localhost:8000
            # - http://localhost:8080 front
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          headers:
            - Accept
            - Authorization
            - Content-Type
            - Origin
            - X-Request-ID
          exposed_headers:
            - Set-Cookie
          credentials: true
          max_age: 3600

  - name: companies-service
    url: http://companies-service:8080
    routes:
      - name: companies-public-route
        paths:
          - /companies
        strip_path: false
        protocols: [http, https]

      - name: companies-protected-route
        paths:
          - /api/companies
          - /api/invitations
          - /api/permission
        strip_path: false
        protocols: [http, https]
        plugins:
          - name: jwt
            config:
              cookie_names:
                - access_token
          - name: account-uuid-header
    plugins:
      - name: cors
        config:
          origins:
            # - http://localhost:8080 front
            - http://localhost:8000
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          headers:
            - Accept
            - Authorization
            - Content-Type
            - Origin
            - X-Request-ID
          exposed_headers:
            - Set-Cookie
          credentials: true
          max_age: 3600

  - name: files-service
    url: http://files-service:8080
    routes:
      - name: files-docs-route
        paths:
          - /files/scalar
          - /files/openapi.json
        strip_path: false
        protocols: [http, https]
      - name: files-protected-route
        paths:
          - /api/files
        strip_path: false
        protocols: [http, https]
        plugins:
          - name: jwt
            config:
              cookie_names:
                - access_token
          - name: account-uuid-header
    plugins:
      - name: cors
        config:
          origins:
            # - http://localhost:8080 front
            - http://localhost:8000
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          headers:
            - Accept
            - Authorization
            - Content-Type
            - Origin
            - X-Request-ID
          exposed_headers:
            - Set-Cookie
          credentials: true
          max_age: 3600

consumers:
  - username: internal-consumer
    jwt_secrets:
      - key: "galaxy-auth"
        secret: "YourSuperSecretLongAndComplexKeyAtLeast32Chars123!"
        algorithm: HS256
