variables:
  AUTH_IMAGE: "$CI_REGISTRY_USER/auth-service:$CI_COMMIT_SHORT_SHA"

auth-compile:
  stage: build-check
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - cd auth-service && dotnet build
  rules:
    - changes:
        - auth-service/**/*

auth-docker-build:
  stage: package
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker build -t $AUTH_IMAGE ./auth-service
    - docker push $AUTH_IMAGE
  needs: ["auth-compile"]
  rules:
    - changes:
        - auth-service/**/*

auth-health-check:
  stage: verify
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: docker
  script:
    - docker compose -f docker-compose.infra.yml up -d
    - |
      echo "Waiting for infrastructure to be healthy..."
      for SVC in postgres-ci redis-ci; do
        echo "Checking $SVC..."
        for i in $(seq 1 20); do
          STATUS=$(docker inspect -f '{{.State.Health.Status}}' "$SVC" 2>/dev/null || echo "starting")
          if [ "$STATUS" = "healthy" ]; then
            echo "SUCCESS: $SVC is ready!"
            break
          fi
          STATE=$(docker inspect -f '{{.State.Status}}' "$SVC" 2>/dev/null || echo "not_found")
          if [ "$STATE" = "exited" ]; then
            echo "ERROR: $SVC has crashed!"
            docker logs "$SVC"
            exit 1
          fi

          echo "...$SVC status is '$STATUS', waiting 2s (attempt $i/20)"
          sleep 2

          if [ "$i" -eq 20 ]; then
            echo "TIMEOUT: $SVC failed to become healthy"
            docker logs "$SVC"
            exit 1
          fi
        done
      done
      echo "Injecting SQL schema..."
      docker exec -i postgres-ci psql -U test -d test < init.sql
    - docker rm -f auth-test || true
    - |
      docker run -d --name auth-test \
        --network galaxy_test_net \
        -e ASPNETCORE_ENVIRONMENT=Development \
        --env-file auth-service/.env.example \
      $AUTH_IMAGE
    - sleep 10
    - docker exec auth-test curl -f http://localhost:8080/health || (docker logs auth-test && exit 1)
  after_script:
    - docker rm -f auth-test || true
    - docker compose -f docker-compose.infra.yml down -v
  needs: ["auth-docker-build"]
  rules:
    - changes:
      - auth-service/**/*

