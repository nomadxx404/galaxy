variables:
  AUTH_IMAGE: "$CI_REGISTRY_USER/auth-service:$CI_COMMIT_SHORT_SHA"

auth-compile:
  stage: build-check
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - cd auth-service && dotnet build
  rules:
    - changes:
        - auth-service/**/*

auth-docker-build:
  stage: package
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker build -t $AUTH_IMAGE ./auth-service
    - docker push $AUTH_IMAGE
  needs: ["auth-compile"]
  rules:
    - changes:
        - auth-service/**/*

auth-health-check:
  stage: verify
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: docker
  variables:
    SERVICE_NAME: "auth"
    COMPONENTS: "postgres redis kafka"
    COMPOSE_PROJECT_NAME: "galaxy-auth-${CI_JOB_ID}"
  script:
    - COMPOSE_FILES=""
    - for c in $COMPONENTS; do COMPOSE_FILES="$COMPOSE_FILES -f infra/docker-compose.$c.yml"; done
    - docker compose $COMPOSE_FILES up -d

    - |
      echo "Waiting for $SERVICE_NAME infrastructure to be healthy..."
      CONTAINERS=$(docker compose $COMPOSE_FILES ps -q)
      for CID in $CONTAINERS; do
        NAME=$(docker inspect -f '{{.Name}}' $CID | sed 's/\///')
        echo "Checking health for $NAME..."
        for i in $(seq 1 30); do
          STATUS=$(docker inspect -f '{{.State.Health.Status}}' $CID 2>/dev/null || echo "starting")
          if [ "$STATUS" = "healthy" ]; then
            echo "SUCCESS: $NAME is ready!"
            break
          fi
          if [ "$i" -eq 30 ]; then
            echo "TIMEOUT: $NAME failed to become healthy"
            docker logs $CID
            exit 1
          fi
          sleep 2
        done
      done

    - echo "Injecting SQL schema..."
    - docker exec -i postgres-${SERVICE_NAME} psql -U test -d test < init.sql

    - docker rm -f auth-test || true
    - |
      docker run -d --name auth-test \
        --network ${COMPOSE_PROJECT_NAME}_default \
        --env-file infra/.env.ci \
        -e POSTGRES_HOST=postgres-${SERVICE_NAME} \
        -e REDIS_HOST=redis-${SERVICE_NAME} \
        -e KAFKA_BOOTSTRAP_SERVERS=kafka-${SERVICE_NAME}:9092 \
        -e ASPNETCORE_ENVIRONMENT=Development \
      $AUTH_IMAGE

    - sleep 10
    - docker exec auth-test curl -f http://localhost:8080/health || (docker logs auth-test && exit 1)

  after_script:
    - docker rm -f auth-test || true
    - COMPOSE_FILES=""
    - for c in $COMPONENTS; do COMPOSE_FILES="$COMPOSE_FILES -f infra/docker-compose.$c.yml"; done
    - docker compose $COMPOSE_FILES down -v
  needs: ["auth-docker-build"]
  rules:
    - changes:
      - auth-service/**/*

