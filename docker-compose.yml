services:
  postgres-galaxy:
    image: postgres:18-alpine
    container_name: postgres-galaxy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata-galaxy:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - galaxy-net

  postgres-galaxy-logs:
    image: postgres:18-alpine
    container_name: postgres-galaxy-logs
    environment:
      POSTGRES_USER: ${LOGS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LOGS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${LOGS_POSTGRES_DB}
    ports:
      - "${LOGS_POSTGRES_PORT}:5432"
    volumes:
      - pgdata-galaxy-logs:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - galaxy-net

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    depends_on:
      - postgres-galaxy
    environment:
      POSTGRES_HOST: postgres-galaxy
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${AUTH_PORT}:8080"
    restart: unless-stopped
    networks:
      - galaxy-net

volumes:
  pgdata-galaxy:
  pgdata-galaxy-logs:

networks:
  galaxy-net:
