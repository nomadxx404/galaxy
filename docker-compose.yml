services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata-galaxy:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - galaxy-net

  postgres-logs:
    image: postgres:18-alpine
    container_name: postgres-logs
    environment:
      POSTGRES_USER: ${LOGS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LOGS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${LOGS_POSTGRES_DB}
    volumes:
      - pgdata-galaxy-logs:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - galaxy-net

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: auth-service
    depends_on:
      auth-redis:
        condition: service_healthy
      postgres:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      REDIS_HOST: auth-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${AUTH_REDIS_PASSWORD}

      PASSWORD_HASHER_MEMORY_SIZE: ${PASSWORD_HASHER_MEMORY_SIZE}
      PASSWORD_HASHER_ITERATIONS: ${PASSWORD_HASHER_ITERATIONS}
      PASSWORD_HASHER_DEGREE_OF_PARALLELISM: ${PASSWORD_HASHER_DEGREE_OF_PARALLELISM}
      PASSWORD_HASHER_SALT_LENGTH: ${PASSWORD_HASHER_SALT_LENGTH}
      PASSWORD_HASHER_HASH_LENGTH: ${PASSWORD_HASHER_HASH_LENGTH}

      OTP_CODE_ACCESS_MINUTES: ${OTP_CODE_ACCESS_MINUTES}

      RESET_PASSWORD_TOKEN_ACCESS_MINUTES: ${RESET_PASSWORD_TOKEN_ACCESS_MINUTES}
    ports:
      - "${AUTH_PORT}:8080"
    restart: unless-stopped
    networks:
      - galaxy-net

  auth-redis:
    image: redis:7-alpine
    container_name: auth-redis
    command: ["redis-server", "--requirepass", "${AUTH_REDIS_PASSWORD}"]
    ports:
      - "${AUTH_REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${AUTH_REDIS_PASSWORD}", "PING"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - galaxy-net

  kong:
    image: kong:latest
    container_name: kong
    depends_on:
      - auth-service
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: info
      KONG_PLUGINS: "bundled,account-uuid-header"
    ports:
      - "8000:8000"
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
      - ./kong/plugins/account-uuid-header:/usr/local/share/lua/5.1/kong/plugins/account-uuid-header:ro
    restart: unless-stopped
    networks:
      - galaxy-net

volumes:
  pgdata-galaxy:
  pgdata-galaxy-logs:
  redis_data:

networks:
  galaxy-net:
