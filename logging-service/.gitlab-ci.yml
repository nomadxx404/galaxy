variables:
  LOGGING_IMAGE: "$CI_REGISTRY_USER/logging-python:$CI_COMMIT_SHORT_SHA"

logging-check:
  stage: build-check
  image: python:3.12-slim-bookworm
  script:
    - pip install --no-cache-dir --root-user-action=ignore ruff mypy
    - ruff check .
    - mypy .
  rules:
    - changes:
        - logging-python/**/*

logging-docker-build:
  stage: package
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin
    - docker build -t $LOGGING_IMAGE ./logging-python
    - docker push $LOGGING_IMAGE
  needs: ["logging-check"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - logging-python/**/*

logging-health-check:
  stage: verify
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker run -d --name logging-test $LOGGING_IMAGE
    - sleep 5
    - docker ps -f name=logging-test | grep Up || (docker logs logging-test && exit 1)
  needs: ["logging-docker-build"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - logging-python/**/*
