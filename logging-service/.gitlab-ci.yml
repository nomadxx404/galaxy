variables:
  LOGGING_IMAGE: "$CI_REGISTRY_USER/logging-service:$CI_COMMIT_SHORT_SHA"

logging-check:
  stage: build-check
  image: python:3.12-slim-bookworm
  script:
    - pip install pydantic pydantic-settings asyncpg fastapi uvicorn aiokafka mypy
    - cd logging-service
    - export PYTHONPATH=$PYTHONPATH:.
    - mypy . --ignore-missing-imports --explicit-package-bases
  rules:
    - changes:
        - logging-service/**/*

logging-docker-build:
  stage: package
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker build -t $LOGGING_IMAGE ./logging-service
    - docker push $LOGGING_IMAGE
  needs: ["logging-check"]
  rules:
    - changes:
        - logging-service/**/*

logging-health-check:
  stage: verify
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: docker
  variables:
    SERVICE_NAME: "logging"
    COMPONENTS: "postgres kafka"
    COMPOSE_PROJECT_NAME: "galaxy-logging-${CI_JOB_ID}"
  script:
    - COMPOSE_FILES=""
    - for c in $COMPONENTS; do COMPOSE_FILES="$COMPOSE_FILES -f infra/docker-compose.$c.yml"; done
    - docker compose $COMPOSE_FILES up -d

    - |
      echo "Waiting for $SERVICE_NAME infrastructure to be healthy..."
      CONTAINERS=$(docker compose $COMPOSE_FILES ps -q)
      for CID in $CONTAINERS; do
        NAME=$(docker inspect -f '{{.Name}}' $CID | sed 's/\///')
        echo "Checking health for $NAME..."
        for i in $(seq 1 30); do
          STATUS=$(docker inspect -f '{{.State.Health.Status}}' $CID 2>/dev/null || echo "starting")
          if [ "$STATUS" = "healthy" ]; then
            echo "SUCCESS: $NAME is ready!"
            break
          fi
          if [ "$i" -eq 30 ]; then
            echo "TIMEOUT: $NAME failed to become healthy"
            docker logs $CID
            exit 1
          fi
          sleep 2
        done
      done

    - echo "Injecting SQL schema..."
    - docker exec -i postgres-${SERVICE_NAME} psql -U test -d test < init.sql

    - |
      echo "Creating mandatory topics..."
      docker exec kafka-${SERVICE_NAME} \
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
        --create --if-not-exists \
        --topic test \
        --partitions 1 \
        --replication-factor 1

    - docker rm -f logging-test || true
    - |
      docker run -d --name logging-test \
        --network ${COMPOSE_PROJECT_NAME}_default \
        --env-file infra/.env.ci \
        -e POSTGRES_HOST=postgres-${SERVICE_NAME} \
        -e KAFKA_BOOTSTRAP_SERVERS=kafka-${SERVICE_NAME}:9092 \
      $LOGGING_IMAGE

    - sleep 20
    - apk add --no-cache curl
    - sleep 10
    - docker exec logging-test curl -f http://localhost:8080/health || (docker logs logging-test && exit 1)

  after_script:
    - docker rm -f logging-test || true
    - COMPOSE_FILES=""
    - for c in $COMPONENTS; do COMPOSE_FILES="$COMPOSE_FILES -f infra/docker-compose.$c.yml"; done
    - docker compose $COMPOSE_FILES down -v
  needs: ["logging-docker-build"]
  rules:
    - changes:
      - logging-service/**/*
