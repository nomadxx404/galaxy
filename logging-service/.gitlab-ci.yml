variables:
  LOGGING_IMAGE: "$CI_REGISTRY_USER/logging-service:$CI_COMMIT_SHORT_SHA"

logging-check:
  stage: build-check
  image: python:3.12-slim-bookworm
  script:
    - pip install pydantic pydantic-settings asyncpg fastapi uvicorn aiokafka mypy
    - cd logging-service
    - export PYTHONPATH=$PYTHONPATH:.
    - mypy . --ignore-missing-imports --explicit-package-bases
  rules:
    - changes:
        - logging-service/**/*

logging-docker-build:
  stage: package
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin
    - docker build -t $LOGGING_IMAGE ./logging-service
    - docker push $LOGGING_IMAGE
  needs: ["logging-check"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - logging-service/**/*

logging-health-check:
  stage: verify
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
  - docker rm -f auth-test || true
  - >
    -e LOGS_POSTGRES_HOST=localhost -e LOGS_POSTGRES_PORT=5432 -e LOGS_POSTGRES_USER=test -e LOGS_POSTGRES_PASSWORD=test -e LOGS_POSTGRES_DB=test
    -e KAFKA_BOOTSTRAP_SERVERS=localhost:9092 -e KAFKA_AUTH_EVENTS_TOPIC=auth-events -e KAFKA_AUTH_EVENTS_TOPIC=companies-events
    $LOGGING_IMAGE
    - docker run -d --name logging-test $LOGGING_IMAGE
    - sleep 5
    - docker ps -f name=logging-test | grep Up || (docker logs logging-test && exit 1)
    - docker rm -f logging-test
  needs: ["logging-docker-build"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - logging-service/**/*
